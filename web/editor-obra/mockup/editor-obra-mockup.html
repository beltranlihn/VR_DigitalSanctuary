<title>Soul Charger Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Sistema de diseño de Immersive Studio Pro / VEATION — copia literal de index.html:16-1201 (sin comentarios) */
  :root{
    --s0:#111111;
    --s1:#1B1B1B;
    --s2:#262626;
    --ink:#E0E0E0;
    --ink-2:#B8B8B8;
    --ink-3:#8C8C8C;
    --ink-dim:#6D6D6D;
    --line-soft:rgba(255,255,255,0.05);

    --line-strong:rgba(255,255,255,0.16);
    --auto-live:#4FC3E8;
    --auto-ovr:#E5B567;
    --danger:#E06C6C;
    --state-on:#4A4A4A;
    --state-hover:#303030;
    --sp-2:2px; --sp-4:4px; --sp-6:6px; --sp-8:8px; --sp-12:12px; --sp-16:16px; --sp-20:20px; --sp-24:24px; --sp-32:32px;
    --bg-0:var(--s0); --bg-1:var(--s0); --bg-2:var(--s1);
    --surface:var(--s1); --surface-2:var(--s2); --surface-3:var(--state-hover);
    --ink-faint:var(--ink-2);
    --well-deep:#0A0B0C;
    --toggle-on:#4A8D6F;
    --react-blue:#7FB2E8;
    --audio-tint:rgba(150,175,130,0.045);
    --floor-tint:rgba(200,100,85,0.07);
    --bar:#242424;
    --p-az:#E0954B;     --p-el:#D8C24B;
    --p-size:#E0645C;   --p-rot:#C58BD0;
    --p-op:#7FB2E8;     --p-exp:#E8C84B;
    --p-sat:#D06FB0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:'Geist','Inter',-apple-system,system-ui,sans-serif;background:var(--bg-1);color:var(--ink);
    -webkit-font-smoothing:antialiased;font-size:11px;letter-spacing:-0.003em;overflow:hidden;user-select:none;}
  .tnum{font-family:'Geist',system-ui,sans-serif;font-variant-numeric:tabular-nums;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-corner{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.14);border-radius:2px;border:2px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.22);}
  input[type=range]{-webkit-appearance:none;appearance:none;height:12px;background:transparent;cursor:pointer;}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--bg-0) 0 var(--pa,0%),var(--pc,#9AA0A8) var(--pa,0%) var(--pb,var(--pct,0%)),var(--bg-0) var(--pb,var(--pct,0%)) 100%);box-shadow:inset 0 1px 2px rgba(0,0,0,0.55);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:11px;height:11px;border-radius:50%;background:transparent;border:none;margin-top:-4px;box-shadow:none;}
  input[type=range]:hover::-webkit-slider-runnable-track{box-shadow:inset 0 1px 2px rgba(0,0,0,0.55),0 0 0 .5px rgba(255,255,255,0.10);}
  input[type=range]:focus{outline:none;}
  .prow>input[type=range]{flex:1;min-width:40px;height:20px;}
  input[type=range]:focus-visible::-webkit-slider-runnable-track{box-shadow:inset 0 1px 2px rgba(0,0,0,0.55),0 0 0 2px rgba(201,205,211,0.30);}
  button{font-family:inherit;color:inherit;padding:0;}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:1.5px solid var(--ink-2);outline-offset:1px;}
  [tabindex]:focus-visible{outline:1px solid var(--ink-2);outline-offset:-1px;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  @keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.99);}to{opacity:1;transform:none;}}
  @keyframes overIn{from{opacity:0;}to{opacity:1;}}
  .app{display:flex;flex-direction:column;height:100vh;width:100vw;background:var(--bg-1);}
  body.preboot #app{visibility:hidden;}
  .top{height:28px;flex-shrink:0;display:flex;align-items:center;gap:var(--sp-8);padding:0 10px;background:var(--surface);border-bottom:.5px solid rgba(255,255,255,0.09);}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-2);flex-shrink:0;}

  .seg button.on,.vseg button.on,.filtseg button.on,.editseg button.on,.groupseg button.on,.seg2 button.on,.kindseg button.on{background:var(--state-on);color:var(--ink);}

  .bodyrow{flex:1;min-height:0;display:flex;}
  .stagecol{flex:1;min-width:0;display:flex;flex-direction:column;}

  .well{display:inline-flex;align-items:stretch;gap:2px;padding:2px;height:22px;box-sizing:border-box;background:var(--s2);border:.5px solid rgba(255,255,255,0.1);border-radius:3px;flex-shrink:0;}
  .well button{display:grid;place-items:center;height:16px;padding:0 7px;border:none;border-radius:2px;background:transparent;color:var(--ink-2);font-family:inherit;font-size:10px;font-weight:600;cursor:pointer;transition:background .12s,color .12s;}

  .searchbox input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--ink);font-family:inherit;font-size:11px;}
  .filtseg{flex-shrink:0;}
  .filtseg button{padding:0 7px;display:grid;place-items:center;}
  .medialist{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:5px 6px 12px;}

  .grphead:hover{background:rgba(255,255,255,0.04);}

  .mthumb .dur{position:absolute;bottom:2px;right:3px;font-family:'Geist',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:11px;color:var(--ink);background:rgba(0,0,0,0.55);padding:0 3px;border-radius:2px;}
  .mthumb .pbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,0.4);}
  .mthumb .pbar>i{display:block;height:100%;width:0;background:var(--ink-2);}
  .mthumb .pbar.gen{height:14px;background:rgba(6,7,9,0.74);}

const _LD=_lum('#0E0F11'), _LL=_lum('#F2F4F8');
function textOn(h){ const L=_lum(h); const rD=(Math.max(L,_LD)+0.05)/(Math.min(L,_LD)+0.05), rL=(Math.max(L,_LL)+0.05)/(Math.min(L,_LL)+0.05); return rD>=rL?'#0E0F11':'#F2F4F8'; }

  scr.querySelectorAll('.tlc [data-id]').forEach(el=>el.addEventListener('click',e=>{ e.stopPropagation(); UI.sel=el.dataset.id; UI.selRole=null; UI.insTab='insp'; const st=document.getElementById('sctl')?.scrollTop||0; build(); const sc2=document.getElementById('sctl'); if(sc2){ sc2.scrollTop=st; drawAnchors(); } }));
  const sc=document.getElementById('sctl'); if(sc) sc.addEventListener('scroll',()=>{ document.querySelectorAll('.ov,.clickdot').forEach(n=>n.remove()); }); }
function wavHeader(buf){ try{ const d=new DataView(buf); if(d.getUint32(0,false)!==0x52494646||d.getUint32(8,false)!==0x57415645) return null; let o=12;
  while(o+8<=d.byteLength){ const id=d.getUint32(o,false), sz=d.getUint32(o+4,true); if(id===0x666d7420) return {fmt:d.getUint16(o+8,true),ch:d.getUint16(o+10,true),sr:d.getUint32(o+12,true),bits:d.getUint16(o+22,true)}; o+=8+sz+(sz&1); } }catch(_){} return null; }
function loadWav(f){ const c=wavTarget; if(!c) return; const url=URL.createObjectURL(f);
  f.arrayBuffer().then(buf=>{ const hdr=wavHeader(buf); const a=new Audio(); a.preload='metadata'; a.src=url;
    const done=dur=>{ c.file={name:f.name,dur,url,hdr}; if(/^FX_NEW_SOUND/.test(c.t)) c.t=cleanId(f.name); build(); };
    a.onloadedmetadata=()=>done(isFinite(a.duration)?a.duration:0); a.onerror=()=>done(0); }).catch(()=>{ c.file={name:f.name,dur:0,url,hdr:null}; build(); }); }
document.getElementById('wavIn').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; if(f) loadWav(f); e.target.value=''; });
function syncOvSeg(){ document.querySelectorAll('#ovSeg button').forEach(x=>x.classList.toggle('on',x.dataset.o===UI.ov)); }
function setOv(o){ UI.ov=o; syncOvSeg(); build(); }
document.querySelectorAll('#ovSeg button').forEach(b=>b.onclick=()=>setOv(b.dataset.o));
document.addEventListener('keydown',e=>{ if(e.target.closest&&e.target.closest('input,select,textarea')) return; if(e.key==='A'&&e.shiftKey) setOv(UI.ov==='add'?'none':'add'); else if(e.key==='g'||e.key==='G') setOv(UI.ov==='logic'?'none':'logic'); else if(e.key==='F8'){ e.preventDefault(); setOv(UI.ov==='problems'?'none':'problems'); } else if(e.key==='Escape') setOv('none'); });
document.getElementById('fsBtn').onclick=()=>{ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); }catch(_){} };
document.addEventListener('fullscreenchange',()=>{ document.getElementById('fsBtn').textContent=document.fullscreenElement?'Exit full screen':'Full screen'; });
/* ---------- fit the 1600×900 app to the whole window ---------- */
function fit(){ const W=window.innerWidth, H=window.innerHeight, k=Math.min(1,W/1280,H/720); SW=Math.round(W/k); SH=Math.round(H/k);
  const scr=document.getElementById('screen'); scr.style.width=SW+'px'; scr.style.height=SH+'px'; scr.style.transform=k<1?`scale(${k})`:'none'; }
let _rz=0; window.addEventListener('resize',()=>{ clearTimeout(_rz); _rz=setTimeout(()=>{ fit(); build(); },80); });
fit(); build();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ drawStage(); drawAnchors(); drawLogic(); });
</script>
