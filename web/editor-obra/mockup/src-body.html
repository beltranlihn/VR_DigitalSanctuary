<style>
/* ===== Soul Charger layer on top of the VEATION design system (only what ISP doesn't have). Tokens: ISP :root. ===== */
:root{color-scheme:dark;--wait-stripe:rgba(255,255,255,0.06);}
html,body{height:100%;}
body{overflow:hidden;user-select:none;background:var(--well-deep);}
#wrap{position:fixed;inset:0;overflow:hidden;background:var(--well-deep);}
.screen{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;}
.screen .app{width:100%;height:100%;position:relative;}
/* mockup-only pill (not part of the app) */
.mockpill{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:8px;height:28px;padding:0 6px 0 12px;border-radius:14px;background:rgba(27,27,27,.92);border:.5px solid rgba(255,255,255,.14);box-shadow:0 8px 26px rgba(0,0,0,.6);opacity:.3;transition:opacity .12s;font-size:11px;color:var(--ink-2);white-space:nowrap;}
.mockpill:hover,.mockpill:focus-within{opacity:1;}
.mockpill .k{color:var(--ink-3);}
.mockpill .well button{height:18px;padding:0 9px;font-size:11px;font-weight:500;}
.mockpill .fs{height:20px;padding:0 10px;border:none;border-radius:10px;background:var(--s2);color:var(--ink);font-size:11px;font-weight:500;cursor:pointer;}
.mockpill .fs:hover{background:var(--state-hover);}
@media (max-width:700px){.mockpill .k,.mockpill .well{display:none;}}
/* no all-caps anywhere */
.mmeta,.selmeta{text-transform:none;letter-spacing:0;}
/* top bar */
.syncpill{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:3px;background:var(--s2);color:var(--ink-2);font-size:11px;font-weight:500;border:.5px solid rgba(255,255,255,.09);cursor:pointer;}
.syncpill:hover{background:var(--state-hover);color:var(--ink);}
.syncpill .sd{width:7px;height:7px;border-radius:50%;background:var(--auto-ovr);}
.pres{display:inline-flex;align-items:center;gap:5px;height:18px;padding:0 6px 0 3px;border-radius:2px;background:var(--s0);color:var(--ink-2);font-size:10.5px;}
.pres i{width:14px;height:14px;border-radius:50%;background:#4E78B3;color:#F2F4F8;font-style:normal;display:grid;place-items:center;font-size:9px;font-weight:600;}
.top .well button{height:16px;padding:0 9px;font-size:11px;font-weight:500;}
/* library */
.mitem{cursor:default;}
.mitem[data-role]{cursor:pointer;}
.mitem .tw{width:12px;flex-shrink:0;color:var(--ink-3);display:grid;place-items:center;}
.mitem .lvl{width:12px;flex-shrink:0;}
.mitem .mtxt{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px;}
.mthumb.gl{display:grid;place-items:center;color:rgba(242,244,248,.9);}
.chip{display:inline-flex;align-items:center;height:14px;padding:0 4px;border-radius:2px;font-size:10px;font-weight:500;background:var(--s0);color:var(--ink-2);flex-shrink:0;}
.chip.ok{color:#9CCBB3;} .chip.prov{color:var(--auto-ovr);} .chip.orf{color:var(--danger);}
/* timeline */
.sctl{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;position:relative;background:var(--s0);}
.tlc{position:relative;}
.tlhead{position:sticky;top:0;z-index:6;display:flex;background:var(--s1);border-bottom:.5px solid rgba(0,0,0,.4);}
.tlhead .hpad{width:168px;flex-shrink:0;display:flex;flex-direction:column;border-right:.5px solid rgba(0,0,0,.4);}
.tlhead .hpad div{display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-size:10px;color:var(--ink-3);}
.tlhead .hfld{flex:1;position:relative;overflow:hidden;}
.actrow{height:18px;position:relative;border-bottom:.5px solid rgba(0,0,0,.35);}
.actb{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 6px;font-size:10px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;border-right:.5px solid rgba(0,0,0,.45);}
.actb.a0{background:var(--s2);} .actb.a1{background:var(--s1);}
.actb .vg{color:var(--ink-3);margin-right:5px;font-weight:400;}
.rulerow{height:24px;position:relative;background:var(--bg-2);border-bottom:.5px solid rgba(0,0,0,.4);}
.tk{position:absolute;bottom:0;width:.5px;background:rgba(255,255,255,.18);}
.tk.mj{height:9px;background:rgba(255,255,255,.32);} .tk.mn{height:4px;}
.tkl{position:absolute;top:3px;font-size:10px;color:var(--ink-3);transform:translateX(3px);white-space:nowrap;}
.momrow{height:16px;position:relative;}
.momb{position:absolute;top:2px;height:12px;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;font-size:10px;color:var(--ink-3);cursor:pointer;}
.momb b{font-weight:600;color:var(--ink-2);background:var(--s2);padding:0 4px;border-radius:2px;line-height:12px;flex-shrink:0;}
.momb.on b{background:var(--state-on);color:var(--ink);}
.momline{position:absolute;top:0;bottom:0;width:.5px;background:var(--line-soft);pointer-events:none;z-index:0;}
.row{display:flex;}
.row .lanehdr{width:168px;flex-shrink:0;}
.fld{flex:1;min-width:0;position:relative;overflow:hidden;}
.fld.alt{background-image:linear-gradient(rgba(255,255,255,.02),rgba(255,255,255,.02));}
.grow .ghd{width:168px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 6px 0 8px;}
.grow .ghd,.grow .gfld{height:22px;background:var(--bg-0);border-top:1px solid rgba(255,255,255,.14);border-bottom:1px solid rgba(255,255,255,.14);box-shadow:inset 0 0 0 100px rgba(0,0,0,.35);}
.grow .gfld{flex:1;position:relative;overflow:hidden;}
.grow .gch{width:14px;height:14px;display:grid;place-items:center;border:none;background:none;color:var(--ink-3);cursor:pointer;padding:0;}
.grow .gch:hover{color:var(--ink);}
.grow .glab{font-size:11px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.grow .gsp{flex:1;}
.grow .gb{width:16px;height:16px;display:grid;place-items:center;border:.5px solid rgba(255,255,255,.1);border-radius:2px;background:var(--s2);color:var(--ink-faint);font-size:11px;font-weight:500;cursor:pointer;padding:0;flex-shrink:0;}
.grow .gb:hover{color:var(--ink);background:var(--state-hover);}
.grow .gb.lk{display:none;} .grow:hover .gb.lk{display:grid;}
.gfld .sum{position:absolute;top:3px;height:14px;border-radius:2px;opacity:.85;font-size:10px;font-weight:600;line-height:14px;padding:0 5px;white-space:nowrap;overflow:hidden;}
.lanehdr.sub{padding-left:22px;}
.lanehdr.sub .bar{left:12px;width:2px;opacity:.85;}
.slot{display:flex;height:16px;}
.slot .shd{width:168px;flex-shrink:0;display:flex;align-items:center;padding-left:22px;font-size:10px;color:var(--auto-ovr);border:1px dashed rgba(229,181,103,.6);border-right:none;background:rgba(229,181,103,.06);}
.slot .sfl{flex:1;border:1px dashed rgba(229,181,103,.6);border-left:none;background:rgba(229,181,103,.06);display:flex;align-items:center;padding-left:8px;font-size:10px;color:var(--auto-ovr);}
/* clips */
.clip .bd{position:absolute;left:0;right:0;top:16px;bottom:0;overflow:hidden;}
.clip .vtx{position:absolute;left:7px;right:4px;top:2px;font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.clip .wv{position:absolute;left:0;bottom:0;opacity:.55;}
.clip.help{border-style:dashed;}
.clip.inact{opacity:.38;filter:saturate(.3);}
.clip.wait .fill{opacity:.5;background-image:repeating-linear-gradient(135deg,var(--wait-stripe) 0 4px,transparent 4px 9px);}
.clip.mech{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);}
.clip .notch{position:absolute;top:16px;bottom:0;width:.5px;background:rgba(255,255,255,.28);}
.clip .gl{display:inline-flex;vertical-align:-2px;margin-right:4px;opacity:.85;}
.clip .cnt{margin-left:6px;font-weight:500;opacity:.75;}
.clip.gsel{outline:1px dashed var(--ink-3);outline-offset:1px;}
.wtail{position:absolute;top:4px;border:1px dashed var(--auto-live);border-left:none;border-radius:0 2px 2px 0;background:rgba(79,195,232,.035);pointer-events:none;}
.wtail .wt{position:absolute;left:6px;top:2px;font-size:10px;color:var(--auto-live);white-space:nowrap;}
.wfw{position:absolute;top:2px;width:2px;background:var(--danger);pointer-events:none;}
.wfw span{position:absolute;left:4px;top:0;font-size:10px;color:var(--danger);white-space:nowrap;}
.whelp{position:absolute;width:7px;height:7px;transform:rotate(45deg);background:var(--ink-2);pointer-events:none;}
.evt{position:absolute;display:flex;align-items:center;gap:5px;height:16px;cursor:pointer;}
.evt i{width:7px;height:7px;transform:rotate(45deg);flex-shrink:0;border:.5px solid rgba(255,255,255,.35);}
.evt span{font-size:10px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.evt.sel i{box-shadow:0 0 0 1.5px var(--ink);} .evt.sel span{color:var(--ink);}
.evt.gsel i{box-shadow:0 0 0 1px var(--ink-3);}
.evt.new i{background:transparent!important;border:1px dashed var(--auto-ovr);} .evt.new span{color:var(--auto-ovr);}
.pls{position:absolute;bottom:6px;width:2px;border-radius:1px;cursor:pointer;}
.plsl{position:absolute;font-size:10px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.anc{position:absolute;left:0;top:0;pointer-events:none;z-index:4;overflow:visible;}
.anc text{font-family:'Geist',system-ui,sans-serif;font-size:10px;font-variant-numeric:tabular-nums;}
.ph{position:absolute;top:18px;width:2px;background:var(--ink);z-index:7;pointer-events:none;}
.ph::before{content:'';position:absolute;left:-5px;top:0;width:12px;height:10px;background:var(--ink);clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%);}

/* logic drawer (ISP .curvedrawer pattern) */
.ldraw{flex-shrink:0;display:flex;flex-direction:column;border-top:.5px solid rgba(0,0,0,.45);background:var(--s0);}

.node{position:absolute;width:168px;background:var(--s1);border:.5px solid rgba(255,255,255,.12);border-radius:3px;box-shadow:0 8px 26px rgba(0,0,0,.45);}
.node .nh{height:22px;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--s2);border-radius:3px 3px 0 0;font-size:11px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;}
.node .nh .sw{width:6px;height:6px;border-radius:1px;flex-shrink:0;}

.node .nr{height:20px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:10.5px;color:var(--ink-2);border-top:.5px solid rgba(255,255,255,.05);}
.node .pt{width:7px;height:7px;border-radius:50%;border:1px solid var(--ink-3);background:var(--s0);flex-shrink:0;}
.node .nr.out{justify-content:flex-end;gap:6px;}
.node .nr.in{justify-content:flex-start;gap:6px;}
.lcv svg{position:absolute;inset:0;pointer-events:none;}
/* viewer */
.stage .vov{position:absolute;inset:0;pointer-events:none;}
.nowcard{position:absolute;left:10px;top:10px;width:228px;background:rgba(27,27,27,.82);border:.5px solid rgba(255,255,255,.10);border-radius:3px;padding:6px 0;pointer-events:auto;}
.nowcard .h{display:flex;align-items:center;gap:6px;padding:0 10px 4px;font-size:10.5px;color:var(--ink-3);}
.nowcard .r{display:flex;align-items:center;gap:7px;height:20px;padding:0 10px;font-size:11px;color:var(--ink-2);}
.nowcard .r b{font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nowcard .r .q{margin-left:auto;color:var(--ink-3);white-space:nowrap;}
.nowcard .r.warn .q{color:var(--auto-live);}
.gizchip{position:absolute;pointer-events:none;}
.waitpill{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;height:26px;padding:0 6px 0 12px;border-radius:13px;background:rgba(27,27,27,.9);border:.5px solid rgba(79,195,232,.5);font-size:11px;color:var(--ink-2);pointer-events:auto;white-space:nowrap;}
.waitpill b{color:var(--ink);font-weight:500;}
.waitpill .tnum{color:var(--auto-live);}
.waitpill button{height:18px;padding:0 8px;border-radius:9px;border:none;background:var(--s2);color:var(--ink);font-size:11px;font-weight:500;cursor:pointer;}
.mapstrip{height:24px;flex-shrink:0;display:flex;align-items:stretch;background:var(--s1);border-top:.5px solid rgba(0,0,0,.45);}
.mapstrip .ed{display:flex;align-items:center;padding:0 10px;font-size:10px;color:var(--ink-3);white-space:nowrap;}
.mapstrip .mp{flex:1;position:relative;}
.mapstrip .mb{position:absolute;top:4px;bottom:4px;border-radius:2px;background:var(--s2);font-size:10px;color:var(--ink-2);display:flex;align-items:center;padding:0 5px;overflow:hidden;white-space:nowrap;border-right:.5px solid rgba(0,0,0,.5);}
.mapstrip .mb.on{background:var(--state-on);color:var(--ink);}
.mapstrip .mph{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);}
/* transport */
.tcbox .rel{font-size:10.5px;color:var(--auto-live);white-space:nowrap;}
.plabel{font-size:10.5px;color:var(--ink-3);margin-left:12px;margin-right:6px;}
/* inspector */
.prow .val{flex:1;min-width:0;font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prow .num.ovr{color:var(--auto-ovr);}
.prow .lock{display:inline-flex;color:var(--ink-3);margin-left:4px;}
.prow[title] .lab{text-decoration:underline dotted rgba(255,255,255,.25);text-underline-offset:3px;}
.anchip{display:inline-flex;align-items:center;gap:5px;height:18px;padding:0 6px;border-radius:2px;background:var(--s0);color:var(--ink);font-size:11px;white-space:nowrap;overflow:hidden;max-width:170px;}
.anchip i{display:inline-flex;color:var(--ink-3);}
.sent{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px 14px 8px;font-size:11px;color:var(--ink-2);}
.sent .selsel{width:auto;min-width:0;padding-right:20px;}
.perstab{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:4px 14px 8px;}

.perstab span{font-size:10px;color:var(--ink-3);}

.perstab div.on{box-shadow:inset 0 0 0 1px var(--ink-3);}
.outs .prow .dotc,.snrow .dotc{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.lread2{margin:8px 14px 12px;padding:7px 9px;border-radius:2px;background:var(--bg-1);color:var(--auto-live);font-size:11px;line-height:1.45;}
.knote{margin:2px 14px 8px;font-size:10.5px;line-height:1.45;color:var(--ink-3);}
.vtext{margin:4px 14px 8px;padding:7px 9px;border-radius:2px;background:var(--s0);color:var(--ink);font-size:11px;line-height:1.5;min-height:44px;}
.nmin{flex:1;min-width:0;height:18px;padding:0 6px;border:none;border-radius:2px;background:var(--s0);color:var(--ink);font-family:inherit;font-size:11px;font-weight:500;}

.drop{margin:4px 14px 8px;height:54px;border:1px dashed rgba(255,255,255,.18);border-radius:3px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink-3);font-size:11px;}

.pend{display:inline-flex;align-items:center;gap:5px;color:var(--auto-ovr);}
.notesl .nrow{display:flex;gap:8px;padding:8px 14px;border-bottom:.5px solid var(--line-soft);}

.notesl .nt span{font-size:10px;color:var(--ink-3);}
.notesl .nt p{margin:0;font-size:11px;line-height:1.45;color:var(--ink-2);}
/* overlays */
.ov{position:absolute;z-index:50;}
.qa{width:340px;background:var(--surface);border:.5px solid rgba(255,255,255,0.13);border-radius:2px;box-shadow:0 12px 34px rgba(0,0,0,0.55);padding:4px;}

.menu button .ar{margin-left:auto;color:var(--ink-3);}

.chip.lit{color:var(--ink-3);border:.5px dashed rgba(255,255,255,.22);background:transparent;margin-left:4px;}

.wavinfo .ok{color:#9CCBB3;} .wavinfo .warn{color:var(--auto-ovr);}

.clip.pb-block{box-shadow:0 0 0 1.5px var(--danger);} .clip.pb-warn{box-shadow:0 0 0 1px rgba(224,108,108,.65);}

  if(c.k==='cond'){ const x=X(r.s), x2=X(r.e), fin=isFinite(zoneT()); return `<div class="cond${sel?' sel':''}${gs?' gsel':''}" data-id="${c.id}" style="left:${x}px;width:${Math.max(40,x2-x)}px;top:${(LH-18)/2}px;" title="Non-blocking condition">${ICO('hourglass',10)}<span>${esc(c.t)} · ${fin?'true at +'+fmtS(zoneT())+' s':'never (Idle)'} · non-blocking</span></div>${fin?`<div class="condok" style="left:${x2-4}px;top:${(LH-8)/2}px;"></div>`:''}`; }
  if(c.k==='dia') return `<div class="evt${sel?' sel':''}${gs?' gsel':''}${c.isNew?' new':''}" data-id="${c.id}" style="left:${X(r.s)-3.5}px;top:${(LH-16)/2}px;max-width:${c._lw||160}px;"><i style="background:${hue}"></i><span>${esc(c.t)}</span></div>`;
  if(c.k==='pulse'){ const h=Math.round((LH-14)*c.amp+6); return `<div class="pls" data-id="${c.id}" style="left:${X(r.s)-1}px;height:${h}px;background:${hue};${sel||gs?'box-shadow:0 0 0 1px var(--ink-3);':''}"></div><span class="plsl" style="left:${X(r.s)+5}px;top:4px;max-width:${c._lw||120}px;">${esc(c.t)}</span>`; }
  const x=X(r.s), w=Math.max(14,X(Math.min(r.e,W0+G.win+40))-x), h=LH-8; const fg=textOn(hue);
  const isHelp=c.k==='vo'&&!!c.help; let cls='clip'+(sel?' sel':'')+(gs?' gsel':'')+(isHelp?' help':'')+(c.k==='mech'?' mech':'');
  if(isHelp&&!helpOn()) cls+=' inact';
  if(PBEL[c.id]) cls+=' pb-'+PBEL[c.id]; if(NEAPK.has(c.id)) cls+=' neapk';
  if(c.id==='HUM'&&!isFinite(zoneT())) cls+=' inact';
  let fill=`background-color:${hue}`; if(c.k==='grad') fill=`background-image:linear-gradient(90deg,#dfe8f5,${hue});opacity:.55`;
  let body='', gl='', cnt='';
  if(c.wired) gl=ICO('wire',10);
  if(c.k==='vo'){ body=`<div class="bd">${wave(c.id,w,h-16,fg)}<div class="vtx">${esc(c.txt)}</div></div>`; gl=ICO('wave',11); }
  if(c.k==='ghost'){ gl=ICO('ghost',11); const n=Math.max(1,Math.floor((r.e-r.s)/4.3)); cnt=`×${n}`; for(let i=1;i<=n;i++) body+=`<span class="notch" style="left:${i*4.3*G.pps}px"></span>`; }
  if(c.k==='mech'&&c.cyc){ cnt='×5'; for(let i=0;i<=5;i++) body+=`<span class="notch" style="left:${(c.lead+i*c.cyc)*G.pps}px"></span>`; gl=ICO('haptic',11); }
  if(c.k==='amb') body=`<div class="bd">${wave(c.id,w,h-16,fg,.35)}</div>`;
  return `<div class="${cls}" data-id="${c.id}" style="left:${x}px;width:${w}px;height:${h}px;"><div class="fill" style="${fill}"></div><div class="scrim"></div><div class="tt" style="background:${hue};color:${fg}"><span class="gl">${gl}</span>${esc(c.t)}${cnt?`<span class="cnt">${cnt}</span>`:''}</div>${body}${PBEL[c.id]?`<span class="pbdot${PBEL[c.id]==='warn'?' ring':''}" title="Open problem · see Problems"></span>`:''}${NEAPK.has(c.id)?'<span class="neapkchip" title="Accepted break: the APK still does what Unreal is wired to do">≠ APK</span>':''}<div class="hd l"></div><div class="hd r"></div></div>`; }
function wave(seed,w,h,fg,amp){ let d='', s=0; for(const ch of seed) s=(s*31+ch.charCodeAt(0))>>>0; const rnd=()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
  for(let x=2;x<w-2;x+=2){ const env=Math.sin(Math.PI*Math.min(1,x/Math.max(8,w)))*0.9+0.1; const a=(amp||0.85)*(h/2-1)*env*(0.35+0.65*rnd()); d+=`M${x} ${h/2-a}V${h/2+a}`; }
  return `<svg class="wv" width="${w}" height="${h}"><path d="${d}" stroke="${fg==='#0E0F11'?'rgba(14,15,17,.55)':'rgba(242,244,248,.5)'}" stroke-width="1"/></svg>`; }
function selKids(){ const s=new Set(); if(UI.sel&&!UI.selRole) kidsOf(UI.sel).forEach(k=>s.add(k.id)); return s; }
function labelWidths(){ GROUPS.forEach(g=>g.subs.forEach(s=>{ const ev=s.clips.filter(c=>c.k==='dia'||c.k==='pulse').map(c=>({c,x:X(R(c.id).s)})).sort((a,b)=>a.x-b.x);
  ev.forEach((o,i)=>{ const nx=i<ev.length-1?ev[i+1].x:o.x+200; o.c._lw=Math.max(18,nx-o.x-14); }); })); }
function timeline(H){ const fw=G.fieldW; labelWidths();
  const acts=ACTS.map((a,i)=>{ const x=Math.max(0,X(a.s)), x2=Math.min(fw,X(a.e)); return `<div class="actb a${i%2}" style="left:${x}px;width:${x2-x}px;">${a.veil?'<span class="vg">⧸⧸ veil</span>':''}${a.n}</div>`; }).join('');
  let ticks=''; for(let t=Math.ceil(W0/2)*2;t<=W0+G.win;t+=2){ const mj=(t%10===0); ticks+=`<span class="tk ${mj?'mj':'mn'}" style="left:${X(t)}px"></span>`; if(mj) ticks+=`<span class="tkl tnum" style="left:${X(t)}px">${tc(t).slice(0,5)}</span>`; }
  ticks+=Object.entries(PBEL).map(([id,sv])=>`<span class="rulmark" style="left:${X(R(id).s)}px;background:var(--danger);opacity:${sv==='warn'?.55:1}" title="problem"></span>`).join('')+[...NEAPK].map(id=>`<span class="rulmark" style="left:${X(R(id).s)}px;background:var(--auto-ovr)"></span>`).join('');
  const pm=MOMS.find(m=>PH>=m.s()&&PH<m.e());
  const moms=MOMS.map(m=>{ const s=m.s(), e=m.e(); if(e<W0) return ''; const x=Math.max(0,X(s)); return `<div class="momb${m===pm?' on':''}" style="left:${x+3}px;max-width:${Math.max(0,X(e)-x-6)}px;"><b>${m.id}</b>${esc(m.n)}</div>`; }).join('');
  const momLines=MOMS.map(m=>{ const s=m.s(); return s>W0?`<div class="momline" style="left:${168+X(s)}px"></div>`:''; }).join('');
  let rows='', alt=0;
  GROUPS.forEach(g=>{ const col=!!UI.collapsed[g.id]; const n=g.subs.reduce((a,s)=>a+s.clips.length,0);
    let sum=''; if(col) g.subs.forEach(s=>s.clips.forEach(c=>{ if(c.k==='dia'||c.k==='pulse') return; const r=R(c.id); const x=X(r.s), w=Math.max(10,X(Math.min(r.e,W0+G.win+40))-x); sum+=`<span class="sum" style="left:${x}px;width:${w}px;background:${HUE[g.id]};color:${textOn(HUE[g.id])}">${esc(c.t)}</span>`; }));
    rows+=`<div class="row grow${g.aud?' aud':''}"><div class="ghd"><button class="gch" data-col="${g.id}" title="${col?'Expand':'Collapse'} group"><span style="display:inline-flex;transform:rotate(${col?-90:0}deg);">${ICO('chevDown',11)}</span></button><span class="glab" title="${g.n} · ${n} items">${g.n}</span><span class="gsp"></span><button class="gb lk" title="Lock group (protects it from edits)">${ICO('lock',10)}</button><button class="gb" title="New lane · Alt+T">+</button></div><div class="gfld">${sum}</div></div>`;
    if(col) return;
    g.subs.forEach((s,si)=>{ const LH=laneH(g,s); alt++;
      rows+=`<div class="row"><div class="lanehdr sub${g.aud?' aud':''}" style="height:${LH}px;"><span class="bar" style="background:${HUE[g.id]}"></span><div class="lnrow"><span class="tag">${si+1}</span><span class="nm">${s.n}</span></div></div><div class="fld lane${g.aud?' aud':''}${alt%2?'':' alt'}" style="height:${LH}px;">${s.clips.map(c=>clipHTML(c,g,LH)).join('')}${UI.ov==='drag'&&g.id==='vo'&&si===0?dragGhost(LH):''}</div></div>`; });
    if(UI.ov==='drag'&&g.id==='vo') rows+=`<div class="slot"><div class="shd">+ New lane</div><div class="sfl">VO 3 · drop here to create it</div></div>`;
  });
  return `<div class="timeline" style="height:${H}px;"><div class="hres" title="Drag to resize"></div><div class="tlmain">
   <div class="sctl" id="sctl"><div class="tlc" id="tlc">
     <div class="tlhead"><div class="hpad"><div style="height:18px;">Acts</div><div style="height:24px;">Time</div><div style="height:16px;">Moments</div></div><div class="hfld"><div class="actrow">${acts}</div><div class="rulerow">${ticks}</div><div class="momrow">${moms}</div></div></div>
     ${momLines}${rows}<svg class="anc" id="anc"></svg><div class="ph" id="ph" style="left:${168+X(PH)-1}px;"></div>
   </div></div></div>
   ${UI.ov==='logic'?logicDrawer():''}${UI.ov==='problems'?problemsDrawer():''}
   <div class="tlzoom" title="Whole piece · drag to scroll, ends to zoom"><div class="tlztrack"><div class="tlzthumb" style="left:35%;width:${UI.mode==='tl'?7:9}%;"><span class="tlzcap l"></span><span class="tlzcap r"></span></div></div></div></div>`; }

function wavHeader(buf){ try{ const d=new DataView(buf); if(d.getUint32(0,false)!==0x52494646||d.getUint32(8,false)!==0x57415645) return null; let o=12;

function fit(){ const W=window.innerWidth, H=window.innerHeight, k=Math.min(1,W/1280,H/720); SW=Math.round(W/k); SH=Math.round(H/k);
