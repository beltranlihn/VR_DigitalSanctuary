<style>

  let body='', gl='', cnt='';

function wave(seed,w,h,fg,amp){ let d='', s=0; for(const ch of seed) s=(s*31+ch.charCodeAt(0))>>>0; const rnd=()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; };

/* ---------- wiring ---------- */
let wavTarget=null;
function wire(){ const scr=document.getElementById('screen');
  scr.querySelectorAll('[data-pers]').forEach(b=>b.onclick=()=>{ UI.pers=b.dataset.pers; build(); });
  scr.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{ const k=b.dataset.col; UI.collapsed[k]=!UI.collapsed[k]; build(); });
  scr.querySelectorAll('[data-lib]').forEach(b=>b.onclick=()=>{ UI.libTab=b.dataset.lib; build(); });
  scr.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{ UI.selRole=b.dataset.role; UI.insTab='insp'; build(); });
  scr.querySelectorAll('[data-newsnd]').forEach(b=>b.onclick=newSound);
  scr.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>setOv(UI.ov==='add'?'none':'add'));
  scr.querySelectorAll('[data-itab]').forEach(b=>b.onclick=()=>{ UI.insTab=b.dataset.itab; build(); });
  scr.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>{ UI.cam=b.dataset.cam; build(); });
  scr.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{ UI.play=b.dataset.play==='1'; build(); });
  scr.querySelectorAll('[data-win]').forEach(b=>b.onclick=()=>{ UI.mode=b.dataset.win; build(); });
  const pb=document.getElementById('persBtn'); if(pb) pb.onclick=e=>{ e.stopPropagation(); document.querySelectorAll('.persmenu').forEach(n=>n.remove()); const p=posIn(pb,scr); const m=document.createElement('div'); m.className='menu ov persmenu'; m.style.left=p.x+'px'; m.style.top=(p.y+24)+'px'; m.style.minWidth='250px';
    m.innerHTML=Object.entries(PERS).map(([k,v])=>`<button data-pk="${k}" class="${UI.pers===k?'on':''}">${v.n}<span class="k">${v.x}</span></button>`).join('');
    scr.appendChild(m); m.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{ UI.pers=b.dataset.pk; build(); }); setTimeout(()=>document.addEventListener('click',()=>m.remove(),{once:true}),0); };
  const lb=document.getElementById('logicBtn'); if(lb) lb.onclick=()=>setOv(UI.ov==='logic'?'none':'logic');
  const nm=document.getElementById('nmIn'); if(nm){ const c=BY[UI.sel]; const commit=()=>{ c.t=cleanId(nm.value); build(); }; nm.addEventListener('change',commit); nm.addEventListener('keydown',e=>{ if(e.key==='Enter') nm.blur(); }); }
  const wl=document.getElementById('wavLoad'); if(wl) wl.onclick=()=>{ wavTarget=BY[UI.sel]; document.getElementById('wavIn').click(); };
  const wp=document.getElementById('wavPlay'); if(wp) wp.onclick=()=>{ const c=BY[UI.sel]; if(c&&c.file){ try{ new Audio(c.file.url).play(); }catch(_){} } };
  const dz=scr.querySelector('.drop'); if(dz){ dz.addEventListener('dragover',e=>{ e.preventDefault(); dz.style.borderColor='var(--auto-ovr)'; }); dz.addEventListener('dragleave',()=>{ dz.style.borderColor=''; }); dz.addEventListener('drop',e=>{ e.preventDefault(); const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(f){ wavTarget=BY[UI.sel]; loadWav(f); } }); }

  const sc=document.getElementById('sctl'); if(sc) sc.addEventListener('scroll',()=>{ document.querySelectorAll('.ov,.clickdot').forEach(n=>n.remove()); }); }
function loadWav(f){ const c=wavTarget; if(!c) return; const url=URL.createObjectURL(f); const a=new Audio(); a.preload='metadata'; a.src=url;
  a.onloadedmetadata=()=>{ c.file={name:f.name,dur:isFinite(a.duration)?a.duration:0,url}; if(/^FX_NEW_SOUND/.test(c.t)) c.t=cleanId(f.name.replace(/\.[^.]+$/,'')); build(); };
  a.onerror=()=>{ c.file={name:f.name,dur:0,url}; build(); }; }
document.getElementById('wavIn').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; if(f) loadWav(f); e.target.value=''; });
function syncOvSeg(){ document.querySelectorAll('#ovSeg button').forEach(x=>x.classList.toggle('on',x.dataset.o===UI.ov)); }

/* ---------- fit the 1600×900 app to the whole window ---------- */
function fit(){ const W=window.innerWidth, H=window.innerHeight, k=Math.min(1,W/1280,H/720); SW=Math.round(W/k); SH=Math.round(H/k);
  const scr=document.getElementById('screen'); scr.style.width=SW+'px'; scr.style.height=SH+'px'; scr.style.transform=k<1?`scale(${k})`:'none'; }
let _rz=0; window.addEventListener('resize',()=>{ clearTimeout(_rz); _rz=setTimeout(()=>{ fit(); build(); },80); });
