<meta charset="utf-8">
<title>Aviso</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&display=swap">
<body style="background:#111;color:#ccc;font:13px sans-serif">
<div id="out"></div>
<div id="prev"></div>
<script>
// Hornea el AVISO INICIAL para Unreal (Beltrán 2026-09-30: build de postulación sin sensor → datos simulados), mismo formato
// que los títulos y créditos: R = letra nítida, G = letra difusa. Un solo bloque de 2048 × 1024: título + cuatro líneas.
const W = 2048, H = 1024, LS = 0.08, fam = "Michroma, sans-serif";
const TITLE = 'SIMULATED PROTOTYPE';
const BODY = ['Soul Charger is designed to respond to your brain activity',
  'and heart rate, measured live by a biofeedback sensor.',
  'This build runs without the sensor: the biometric data',
  'you will see is simulated. The experience will begin on its own.'];
function widthAt(g, text, fs) { g.font = `400 ${fs}px ${fam}`; return [...text].reduce((a, ch) => a + g.measureText(ch).width, 0) + LS * fs * (text.length - 1); }
function line(g, text, fs, y) {
  g.font = `400 ${fs}px ${fam}`; g.textBaseline = 'middle'; g.fillStyle = '#fff';
  const chars = [...text], ws = chars.map(ch => g.measureText(ch).width), sp = LS * fs;
  let x = (W - (ws.reduce((a, b) => a + b, 0) + sp * (chars.length - 1))) / 2;
  chars.forEach((ch, i) => { g.fillText(ch, x, y); x += ws[i] + sp; });
}
function blur(src, f) {
  let cur = src, w = W, h = H, st = [];
  while (w > W / f) { w = Math.round(w / 2); h = Math.round(h / 2); const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(cur, 0, 0, w, h); st.push(c); cur = c; }
  for (let i = st.length - 2; i >= -1; i--) { const tw = i >= 0 ? st[i].width : W, th = i >= 0 ? st[i].height : H;
    const c = document.createElement('canvas'); c.width = tw; c.height = th; const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(cur, 0, 0, tw, th); cur = c; }
  return cur;
}
window.bake = async () => {
  await document.fonts.load('400 100px Michroma');
  const probe = document.createElement('canvas').getContext('2d');
  let fsB = 58; for (const n of BODY) fsB = Math.min(fsB, Math.floor(58 * (W * 0.9) / widthAt(probe, n, 58)));
  const fsT = Math.min(120, Math.floor(120 * (W * 0.7) / widthAt(probe, TITLE, 120)));
  const s = document.createElement('canvas'); s.width = W; s.height = H;
  const g = s.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  line(g, TITLE, fsT, H * 0.24);
  BODY.forEach((b, i) => line(g, b, fsB, H * (0.46 + i * 0.105)));
  const b = blur(s, 16);
  const A = g.getImageData(0, 0, W, H).data, B = b.getContext('2d').getImageData(0, 0, W, H).data;
  let mb = 1; for (let i = 0; i < B.length; i += 4) if (B[i] > mb) mb = B[i];
  const o = document.createElement('canvas'); o.width = W; o.height = H; const og = o.getContext('2d'); const img = og.createImageData(W, H);
  for (let i = 0; i < A.length; i += 4) { img.data[i] = A[i]; img.data[i + 1] = Math.min(255, B[i] * 255 / mb); img.data[i + 2] = 0; img.data[i + 3] = 255; }
  og.putImageData(img, 0, 0);
  window.__aviso = o.toDataURL('image/png');
  s.style.width = '1024px'; s.style.display = 'block'; document.getElementById('prev').appendChild(s);
  // bordes horizontales del texto (para U0/U1 del barrido)
  let x0 = W, x1 = 0; for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x++) if (A[(y * W + x) * 4] > 40) { if (x < x0) x0 = x; if (x > x1) x1 = x; }
  document.getElementById('out').textContent = `listo: título ${fsT}px, cuerpo ${fsB}px, U0 ${(x0 / W).toFixed(4)} U1 ${(x1 / W).toFixed(4)}`;
  return { fsT, fsB, U0: +(x0 / W).toFixed(4), U1: +(x1 / W).toFixed(4) };
};
window.send = async () => {
  const blob = await (await fetch(window.__aviso)).blob();
  const r = await fetch('http://127.0.0.1:8767/save?name=T_Title_DISCLAIMER', { method: 'POST', body: blob });
  return r.status;
};
</script>
</body>
