[/Script/Engine.RendererSettings]
; Disabling distance fields avoids requiring a full depth pre-pass, which is slow on standalone XR devices.
r.DistanceFields=0

; This reverts the mobile deferred renderer to single-pass/subpass rendering, which was the default before UE 5.7.
; Multi-pass deferred is currently disabled for VR Template due to rendering issues with mobile multi-view.
r.Mobile.AllowFramebufferFetch=1

; PSO precaching is extremely slow on first launch for standlone XR devices.
; Projects are recommended to use Bundled PSO Caches to avoid stuttering.
; Alternatively, re-enable PSO precaching and conceal it with a loading screen by querying FShaderPipelineCache::NumPrecompilesRemaining().
; 2026-08-21: encendido para matar el hitch de PSO al cargar la primera sala (medido: frame de ~100 ms al aparecer el Hall). Era la herencia del VRTemplate (ver packaging-pso.md).
r.PSOPrecaching=1
; ==========================================================================
; Ajustes de RENDER VR que son EXCLUSIVOS DEL DEVICE (movidos desde
; DefaultEngine.ini el 2026-08-12). Estaban en la config compartida y por lo
; tanto tambien se aplicaban al VR Preview por Meta Link, que es PC.
;
; 🔴 Por que se movieron: XR_FB_foveation es una extension de META, implementada
; dentro de LibOVRRTImpl64_1.dll. Pedirla por Link hacia que la sesion de PC
; entrara en ese codigo, y los crashes del 2026-08-12 son un access violation
; DENTRO de esa DLL en el primer frame presentado. Ademas el 125% provocaba una
; DOBLE asignacion del swapchain al arrancar (4368x2400 -> 3488x1920 en el log).
; Ninguna de las dos cosas tiene sentido en PC: el FFR necesita el VRS por
; hardware del Quest.
; ==========================================================================

[/Script/OpenXRHMD.OpenXRHMDSettings]
; Habilita la extension XR_FB_foveation (requerida para que los CVars de FFR hagan algo).
bIsFBFoveationEnabled=True

[SystemSettings]
; Resolucion de render VR. 🔴 'vr.PixelDensity' NO EXISTE desde UE 5.5 (verificado con SearchCVars: {}).
; Fue renombrada a la de abajo y la escala paso de 1.0 a 100 (porcentaje).
; 100 = resolucion recomendada del runtime (default). 125 ~= panel nativo del Quest 3 (2064x2208/ojo).
; Subir a 135 si sobra GPU; bajar si el framerate sufre.
; 2026-08-21: 125 -> 135 para atacar el aliasing residual. Es supersampling: el unico
; remedio que tambien suaviza los bordes de ALPHA (SDF del vidrio, ameba, haz), que
; MSAA estructuralmente NO antialiasa. Cuesta (135/125)^2 = 1.17x de fill rate.
; ⚠ Si OVR Metrics muestra caida de fps, ESTA es la primera linea a revertir a 125.
xr.SecondaryScreenPercentage.HMDRenderTarget=135
; Fixed Foveated Rendering (Quest). 🔴 Los nombres van SIN punto tras 'OpenXRFB'
; (los viejos 'xr.OpenXRFB.Foveation*' no existen). Nivel 1 = Low: paga la resolucion
; extra sin degradar el texto/iconos del centro (nivel 2-3 se nota mucho en UI).
xr.OpenXRFBFoveationLevel=1
; 🔴 2026-08-21: DINAMICO APAGADO (era 1) — causa principal del "diente de sierra en
; algunos bordes". [SRC] FBFoveationImageGenerator.cpp:16 lo define como
;   "Whether dynamically changing foveation based on performance headroom is enabled."
; Con 1, cuando la GPU se aprieta el runtime SUBE solo el nivel (1->2->3), y 2-3 degradan
; visiblemente. Como la obra es fill-rate bound, en las salas cargadas escalaba y la
; periferia perdia resolucion => aliasing INTERMITENTE, solo en algunos bordes/salas.
; En 0 la foveacion queda clavada en Low y nunca degrada. Predecible > adaptativo.
xr.OpenXRFBFoveationDynamic=0
; VRS por hardware: Support ya venia en 1, pero Enable estaba en 0 -> el FFR necesita ambos.
r.VRS.Enable=1

; 2026-08-21: filtrado anisotropico para que los pisos no se laven en angulo rasante
; (el "borroso mas adelante" que se ve igual en el preview Android XR). 8x es barato en Adreno.
r.MaxAnisotropy=16

; 2026-08-21: PSO precaching a fondo. El motor avisa que ProxyCreationWhenPSOReady esta DEPRECADO:
; el reemplazo es ProxyCreationStrategy (1 = el proxy espera a que su PSO este listo, sin el
; destello de un frame con el material por defecto; ya es el default, se deja explicito).
r.PSOPrecache.ProxyCreationStrategy=1
; Resources=1 precachea TODOS los PSOs posibles en el PostLoad (al cargar), en vez de on-demand
; al primer draw. El costo se paga en el arranque -que transcurre en negro- y no a mitad de obra:
; es el arreglo del glitch al aparecer Alma y de los pequenos al entrar a cada sala.
r.PSOPrecache.Resources=1
; El resto del sistema, explicito (casi todos son ECVF_ReadOnly: por consola NO hacen nada,
; tienen que estar aca). Mode=0 = Full PSO, no solo preload de shaders.
r.PSOPrecache.Components=1
r.PSOPrecache.GlobalShaders=1
r.PSOPrecache.Mode=0
; Esperar TODO lo precacheado, no solo lo de alta prioridad.
r.PSOPrecaching.WaitForHighPriorityRequestsOnly=0
; 🔬 MEDICION — ✅ CERRADO 2026-08-21. Corrio en 2 (loguea cada precache MISS) sobre el
; build v7 y el log del visor dio 0 misses y 0 hitches: no queda ningun PSO compilandose
; en runtime. Se baja a 0 (la validacion tiene costo). Volver a 2 solo si reaparecen saltos.
r.PSOPrecache.Validation=0
; Umbral para que el motor marque una compilacion como hitch en el log (ms).
r.PSO.RuntimeCreationHitchThreshold=10
;
; 🔴 NO intentar el Bundled PSO Cache (.spc) sin leer esto antes: en Vulkan, el bundled cache
; y el precaching son MUTUAMENTE EXCLUYENTES (VulkanRHI.cpp:462). Con AllowVulkanPSOPrecache=1
; (default) el motor pone GRHISupportsPipelineFileCache=false -> el .upipelinecache NO se abre
; y "-logpso" no graba nada, en silencio. El log del device lo canta:
; "Vulkan PSO Precaching = 1, PipelineFileCache = 0". Para la ruta del .spc habria que apagar
; r.Vulkan.AllowPSOPrecaching o encender r.Vulkan.EnablePSOFileCacheWhenPrecachingActive.
