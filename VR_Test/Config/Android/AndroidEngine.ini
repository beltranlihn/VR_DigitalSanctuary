[/Script/Engine.RendererSettings]
; Disabling distance fields avoids requiring a full depth pre-pass, which is slow on standalone XR devices.
r.DistanceFields=0

; This reverts the mobile deferred renderer to single-pass/subpass rendering, which was the default before UE 5.7.
; Multi-pass deferred is currently disabled for VR Template due to rendering issues with mobile multi-view.
r.Mobile.AllowFramebufferFetch=1

; PSO precaching is extremely slow on first launch for standlone XR devices.
; Projects are recommended to use Bundled PSO Caches to avoid stuttering.
; Alternatively, re-enable PSO precaching and conceal it with a loading screen by querying FShaderPipelineCache::NumPrecompilesRemaining().
r.PSOPrecaching=0
; ==========================================================================
; Ajustes de RENDER VR que son EXCLUSIVOS DEL DEVICE (movidos desde
; DefaultEngine.ini el 2026-08-12). Estaban en la config compartida y por lo
; tanto tambien se aplicaban al VR Preview por Meta Link, que es PC.
;
; 🔴 Por que se movieron: XR_FB_foveation es una extension de META, implementada
; dentro de LibOVRRTImpl64_1.dll. Pedirla por Link hacia que la sesion de PC
; entrara en ese codigo, y los crashes del 2026-08-12 son un access violation
; DENTRO de esa DLL en el primer frame presentado. Ademas el 125% provocaba una
; DOBLE asignacion del swapchain al arrancar (4368x2400 -> 3488x1920 en el log).
; Ninguna de las dos cosas tiene sentido en PC: el FFR necesita el VRS por
; hardware del Quest.
; ==========================================================================

[/Script/OpenXRHMD.OpenXRHMDSettings]
; Habilita la extension XR_FB_foveation (requerida para que los CVars de FFR hagan algo).
bIsFBFoveationEnabled=True

[SystemSettings]
; Resolucion de render VR. 🔴 'vr.PixelDensity' NO EXISTE desde UE 5.5 (verificado con SearchCVars: {}).
; Fue renombrada a la de abajo y la escala paso de 1.0 a 100 (porcentaje).
; 100 = resolucion recomendada del runtime (default). 125 ~= panel nativo del Quest 3 (2064x2208/ojo).
; Subir a 135 si sobra GPU; bajar si el framerate sufre.
xr.SecondaryScreenPercentage.HMDRenderTarget=125
; Fixed Foveated Rendering (Quest). 🔴 Los nombres van SIN punto tras 'OpenXRFB'
; (los viejos 'xr.OpenXRFB.Foveation*' no existen). Nivel 1 = Low: paga la resolucion
; extra sin degradar el texto/iconos del centro (nivel 2-3 se nota mucho en UI).
xr.OpenXRFBFoveationLevel=1
xr.OpenXRFBFoveationDynamic=1
; VRS por hardware: Support ya venia en 1, pero Enable estaba en 0 -> el FFR necesita ambos.
r.VRS.Enable=1
