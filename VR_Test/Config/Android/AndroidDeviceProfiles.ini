; ==========================================================================
; Device Profiles — ANDROID / Meta Quest
; Creado 2026-08-21 para atacar el aliasing de la TEXTURA DE PISO.
;
; 🔴 EL PROBLEMA
; El piso de las salas usa M_RoomInterior con la textura /Game/XRFramework/Textures/T_Grid
; (la grilla del VRTemplate): patron cuadriculado, alto contraste, y muy tileado
; (localUVDensities ~4398 en el mesh Piso3). Sintoma reportado en visor: "si estoy recto
; se ve bien, pero si ladeo un poco la cabeza se ve diente de sierra el patron cuadriculado".
;
; 🔴 POR QUE NI MSAA NI LA RESOLUCION LO ARREGLAN SOLOS
; MSAA solo antialiasa SILUETAS de geometria: el patron esta DENTRO del triangulo, no en
; un borde, asi que el MSAA 4x no lo toca. Es aliasing de TEXTURA, y eso lo maneja la
; cadena mipmap + filtrado.
;
; 🔴 LO QUE ESTABA MAL
; T_Grid esta bien configurada (mips ON, TEXTUREGROUP_World, sRGB, Filter=TF_Default), o sea
; que HEREDA el filtro del grupo. Y el grupo, heredado de [GlobalDefaults DeviceProfile]
; (BaseDeviceProfiles.ini:184), viene asi:
;     TEXTUREGROUP_World ... MinMagFilter=aniso, MipFilter=point
; [SRC] TextureLODSettings.cpp:130-137 — 'aniso' + MipFilter 'point' resuelve a
; ETextureSamplerFilter::AnisotropicPoint = anisotropico SIN trilineal. El salto entre
; niveles de mip es un corte DURO, sin mezcla => costura de mip visible que "nada" al
; mover la cabeza, justo lo que se reporto.
; Con MipFilter=linear resuelve a AnisotropicLinear = anisotropico + TRILINEAL: la
; transicion entre mips se interpola y la costura desaparece.
;
; ⚠ POR QUE NO SE ARREGLA EN LA TEXTURA
; Poner Filter=TF_Trilinear en T_Grid mapea a SF_Trilinear, que PIERDE la anisotropia
; (misma funcion, rama de MinMagFilter=linear). En un piso visto en angulo rasante la
; anisotropia importa mas que el trilineal: hay que conservar las DOS. De ahi que el
; arreglo vaya en el grupo de texturas y no en el asset.
;
; ⚠ POR QUE EN [Meta_Quest_3] Y NO EN [Android]
; UDeviceProfile::ValidateTextureLODGroups (DeviceProfile.cpp:131-157) ordena el array por
; Group y rellena desde el PADRE cualquier grupo que el hijo no declare. Entonces alcanza
; con declarar SOLO el grupo que se quiere cambiar; los otros ~40 se heredan intactos.
; Se pone en el perfil HOJA (el activo segun el log del visor:
; "Selected Device Profile: [Meta_Quest_3]") porque ni esa seccion ni sus padres declaran
; TextureLODGroups — solo lo hace [GlobalDefaults] — asi que NO queda una entrada duplicada
; para el mismo Group, que es lo unico que romperia el sort+insert de Validate.
;
; ⚠ COSTO: trilineal agrega una muestra de mip por tap, y con r.MaxAnisotropy=16 los taps
; ya son varios. Si OVR Metrics muestra caida de fps, el orden de reversion es:
;   1) xr.SecondaryScreenPercentage.HMDRenderTarget 135 -> 125  (AndroidEngine.ini)
;   2) r.MaxAnisotropy 16 -> 8                                   (AndroidEngine.ini)
;   3) MipFilter linear -> point                                 (este archivo)
; ==========================================================================

[Meta_Quest_3 DeviceProfile]
+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=16384,LODBias=0,MinMagFilter=aniso,MipFilter=linear,MipGenSettings=TMGS_SimpleAverage)

[Meta_Quest_3S DeviceProfile]
+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=16384,LODBias=0,MinMagFilter=aniso,MipFilter=linear,MipGenSettings=TMGS_SimpleAverage)
