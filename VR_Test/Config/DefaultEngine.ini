[/Script/Engine.StreamingSettings]
; El default del motor es 5.0 ms de registro de actores por frame (BaseEngine.ini).
; Contra el presupuesto de 13.9 ms de Quest eso es el 36% del frame: un frame
; perdido garantizado en cada carga. Epic embarca ese numero para juegos de
; pantalla a 30/60 fps y nadie lo tuneo para VR. Lo bajamos y aceptamos que la
; carga tarde mas frames, porque igual la escondemos detras del fade a negro.
s.LevelStreamingActorsUpdateTimeLimit=1.5
; El gemelo del lado de descarga.
s.UnregisterComponentsTimeLimit=0.5
; NO tocar: en 0 todo el level loading bloquea el game thread (CoreSettings.cpp).
s.UseBackgroundLevelStreaming=True

; ---- 2026-08-21: CERO SALTOS DE FRAME (pedido de Beltran: "que nunca haya un salto,
; si hay que compilar/cargar todo en el arranque, perfecto"). Verificado leyendo el
; codigo del motor (CoreSettings.cpp / World.cpp), no de memoria. ----
;
; 1) EL CULPABLE DE LOS SALTOS AL CRUZAR PUERTAS. La ayuda del motor dice literal:
;    "reclaim memory immediately at the expense of a hitch". Al descargar la sala
;    anterior forzaba un GC completo en un frame. Apagado: la memoria se recupera
;    goteando por los GC incrementales de abajo.
s.ForceGCAfterLevelStreamedOut=0
s.ContinuouslyIncrementalGCWhileLevelsPendingPurge=1
s.ContinuouslyIncrementalGCWhileActorsPendingPurge=1
;
; 2) Los "extra time" de prioridad se SUMAN al presupuesto y anulan el tuneo de arriba
;    justo cuando mas importa (carga de alta prioridad). A cero.
s.PriorityLevelStreamingActorsUpdateExtraTime=0.0
s.PriorityAsyncLoadingExtraTime=0.0
;
; 3) El time limit solo se chequea CADA N COMPONENTES: con granularidad 10 se pasa del
;    presupuesto igual. Bajarla es lo que hace que el 1.5 ms de arriba se respete.
s.LevelStreamingComponentsRegistrationGranularity=2
s.LevelStreamingComponentsUnregistrationGranularity=2
s.LevelStreamingRouteActorInitializationGranularity=2
; Este venia en 0 = TODO EN UNA PASADA -> pico garantizado al sacar un nivel.
s.LevelStreamingRouteActorEndPlayForRemoveFromWorldGranularity=4
; Que la inicializacion de actores no se sume al registro en el mismo frame.
s.ForceRouteActorInitializeNextFrame=1
;
; 4) La carga de assets con el mismo criterio, y que no queme el presupuesto entero
;    esperando I/O.
s.AsyncLoadingTimeLimit=2.0
s.AsyncLoadingUseFullTimeLimit=False

[/Script/Engine.UserInterfaceSettings]
; VR-only: no hay UI de pantalla, asi que la curva de DPI se deja PLANA en 1.0.
; Sin esto el WidgetComponent maqueta a una resolucion logica distinta a la del
; Designer y todo lo definido en pixeles (fuentes, corner radius) sale escalado.
RenderFocusRule=NavigationOnly
ApplicationScale=1.000000
UIScaleRule=ShortestSide
UIScaleCurve=(EditorCurveData=(PreInfinityExtrap=RCCE_Constant,PostInfinityExtrap=RCCE_Constant,Keys=((InterpMode=RCIM_Linear,TangentMode=RCTM_Auto,TangentWeightMode=RCTWM_WeightedNone,Time=0.000000,Value=1.000000,ArriveTangent=0.000000,ArriveTangentWeight=0.000000,LeaveTangent=0.000000,LeaveTangentWeight=0.000000)),DefaultValue=1.000000),ExternalCurve=None)


[/Script/Engine.GarbageCollectionSettings]
; ---- 2026-08-21: el GC repartido en el tiempo, para que nunca produzca un pico ----
; El purge incremental baja de 2 ms a 1 ms por frame (7% del frame de Quest), y la
; granularidad baja para que ese milisegundo se respete de verdad (el limite se
; chequea cada N destroys).
gc.IncrementalGCTimePerFrame=0.001
gc.IncrementalBeginDestroyEnabled=True
gc.IncrementalBeginDestroyGranularity=4
; La fase de MARCADO (reachability) es la que produce el pico grande. Estos dos la
; reparten en frames. Marcados como EXPERIMENTAL en el codigo del motor: si aparece
; comportamiento raro, son los primeros dos que se apagan.
gc.AllowIncrementalReachability=True
gc.IncrementalReachabilityTimeLimit=0.002
gc.AllowIncrementalGather=True
; Clusters: Epic los embarca en False en BaseEngine.ini. En True el GC recorre MENOS
; objetos (menos trabajo total, no solo mejor repartido) a cambio de algo mas de tiempo
; en la carga: exactamente el trade que queremos.
; OJO: el motor tiene un typo en el nombre, es "AssetClustrering".
gc.AssetClustreringEnabled=True
gc.ActorClusteringEnabled=True
gc.MinGCClusterSize=5
; El GC periodico de Epic cae cada 61,1 s: en una obra de 15-20 min eso son ~18 dados
; tirados a ver si uno cae en un momento sensible. Subido por encima de la duracion de
; la pieza (se mantiene la costumbre de Epic de usar un numero fraccionario para
; desfasar colisiones con otros timers).
gc.TimeBetweenPurgingPendingKillObjects=1201.3

