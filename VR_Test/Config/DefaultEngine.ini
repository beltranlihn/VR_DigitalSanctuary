; 🔴🔴 EL FFR Y LA RESOLUCION DE RENDER SE MUDARON A Config/Android/AndroidEngine.ini
; (2026-08-12). Estaban aca, o sea en la config COMPARTIDA, y por lo tanto se
; aplicaban tambien al VR Preview por Meta Link, que es PC.
;
; Lo que estaba aca y ahora es solo-device:
;   bIsFBFoveationEnabled  ·  xr.SecondaryScreenPercentage.HMDRenderTarget=125
;   xr.OpenXRFBFoveationLevel=1  ·  xr.OpenXRFBFoveationDynamic=1  ·  r.VRS.Enable=1
;
; Por que: XR_FB_foveation es una extension de META implementada DENTRO de
; LibOVRRTImpl64_1.dll, y los crashes de Link del 2026-08-12 son un access
; violation dentro de esa misma DLL, en el primer frame presentado. Pedirle
; foveacion por Link no aporta nada (el FFR necesita el VRS por hardware del
; Quest) y ademas el 125% provocaba una DOBLE asignacion del swapchain al
; arrancar (en el log: 4368x2400 -> 3488x1920).
;
; ⚠ NO devolverlas aca. Si hay que tocar la resolucion o el FFR del visor,
; se toca en Config/Android/AndroidEngine.ini.

